services:
  backend:
    build: ./server
    container_name: backend_container
    ports:
      - "5000:5000"

  frontend:
    build: ./Front   # <-- correction ici
    container_name: frontend_container
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:5000
